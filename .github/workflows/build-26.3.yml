name: Build Minecraft 26.3

on:
  push:
    branches: [port-26.3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build
      - name: Publish build
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: build-${{ github.run_id }}
        run: |
          gh release create "$RELEASE_TAG" build/libs/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "Minecraft 26.3 build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA}."
          echo "url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - name: Comment on upstream PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.UPSTREAM_PR_TOKEN }}
          script: |
            const marker = '<!-- better-ping-display-26.3-build -->';
            const body = `${marker}\nAutomated Minecraft 26.3 build for commit \`${context.sha}\`.\n\n[Download the build](${{ steps.release.outputs.url }})`;
            const issue_number = 68;
            const { owner, repo } = { owner: 'vladmarica', repo: 'better-ping-display-fabric' };
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
